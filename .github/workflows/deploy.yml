name: CDK Multi-User Pipeline

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Detect environment based on branch
      - name: Detect environment
        id: detect-env
        run: |
          BRANCH="${{ github.ref }}"

          if [[ "$BRANCH" == "refs/heads/main" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

      # Generate unique session name
      - name: Generate session name
        id: session
        run: |
          ENV="${{ steps.detect-env.outputs.environment }}"
          USER="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          ATTEMPT="${{ github.run_attempt }}"

          SESSION="cdk-${ENV}-${USER}-${RUN_ID}-${ATTEMPT}"

          echo "session=$SESSION" >> $GITHUB_OUTPUT
          echo "Session: $SESSION"

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install CDK project dependencies
      - name: Install root dependencies
        run: npm ci

      # Build frontend
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      # Build CDK project (only if your package.json has a build script)
      - name: Build
        run: npm run build

       # Run unit tests
      - name: Run unit tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::827602716979:role/github-actions-andrew-milne-bakehouse
          aws-region: eu-west-2
          role-session-name: ${{ steps.session.outputs.session }}

      # Synthesize CloudFormation
      - name: CDK synth
        run: npx cdk synth
        env:
          BAKEHOUSE_STACK_NAME: andrew-milne-bakehouse
          CDK_SESSION: ${{ steps.session.outputs.session }}
          CDK_ENV: ${{ steps.detect-env.outputs.environment }}

      # Deploy
      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        env:
          BAKEHOUSE_STACK_NAME: andrew-milne-bakehouse
          CDK_SESSION: ${{ steps.session.outputs.session }}
          CDK_ENV: ${{ steps.detect-env.outputs.environment }}
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke tests
        uses: grafana/run-k6-action@v1
        with:
          path: test/k6/smoke.js
