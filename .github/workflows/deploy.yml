name: CDK Multi-User Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Identify user + environment
      # ----------------------------
      - name: Detect environment
        id: detect-env
        run: |
          BRANCH="${{ github.ref }}"

          if [[ "$BRANCH" == "refs/heads/main" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

      # ----------------------------
      # Identify developer
      # ----------------------------
      - name: Generate session name
        id: session
        run: |
          USER="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          ATTEMPT="${{ github.run_attempt }}"

          SESSION="cdk-${ENV}-${USER}-${RUN_ID}-${ATTEMPT}"

          echo "session=$SESSION" >> $GITHUB_OUTPUT
          echo "Session: $SESSION"

      # ----------------------------
      # Setup runtime
      # ----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # ----------------------------
      # CDK synth with isolation
      # ----------------------------
      - name: CDK synth
        run: npx cdk synth
        env:
          BAKEHOUSE_STACK_NAME: andrew-milne-bakehouse
          CDK_SESSION: ${{ steps.session.outputs.session }}
          CDK_ENV: ${{ steps.detect-env.outputs.environment }}
