name: CDK Multi-User Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Detect environment based on branch
      - name: Detect environment
        id: detect-env
        run: |
          BRANCH="${{ github.ref }}"

          if [[ "$BRANCH" == "refs/heads/main" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

      # Generate unique session name
      - name: Generate session name
        id: session
        run: |
          ENV="${{ steps.detect-env.outputs.environment }}"
          USER="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          ATTEMPT="${{ github.run_attempt }}"

          SESSION="cdk-${ENV}-${USER}-${RUN_ID}-${ATTEMPT}"

          echo "session=$SESSION" >> $GITHUB_OUTPUT
          echo "Session: $SESSION"

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install CDK project dependencies
      - name: Install root dependencies
        run: npm ci

      # Build frontend
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      # Build CDK project (only if your package.json has a build script)
      - name: Build
        run: npm run build

      # Synthesize CloudFormation
      - name: CDK synth
        run: npx cdk synth
        env:
          BAKEHOUSE_STACK_NAME: andrew-milne-bakehouse
          CDK_SESSION: ${{ steps.session.outputs.session }}
          CDK_ENV: ${{ steps.detect-env.outputs.environment }}
